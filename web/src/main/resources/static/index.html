<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spike rutas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh;
               background: white; color: #111; }
        form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: #f2f4f8; }
        input, select, button { padding: 8px; font-size: 16px; flex: 1 1 140px; }
        button { background: #2563eb; color: white; border: none; border-radius: 6px; }
        #resultado { padding: 8px 12px; }
        #mapa { flex: 1; }
    </style>
</head>
<body>
<form id="formulario">
    <input id="origen" placeholder="Origen" value="Castellón de la Plana" required>
    <input id="destino" placeholder="Destino" value="Valencia" required>
    <select id="modo">
        <option value="driving-car">Coche</option>
        <option value="cycling-regular">Bicicleta</option>
        <option value="foot-walking">A pie</option>
    </select>
    <button type="submit">Calcular ruta</button>
</form>
<div id="resultado"></div>
<div id="mapa"></div>

<script>
    const mapa = L.map('mapa').setView([39.98, -0.05], 9);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);
    let linea = null;

    document.getElementById('formulario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const params = new URLSearchParams({
            origen: document.getElementById('origen').value,
            destino: document.getElementById('destino').value,
            modo: document.getElementById('modo').value
        });
        const resultado = document.getElementById('resultado');
        resultado.textContent = 'Calculando...';

        const resp = await fetch('/api/ruta?' + params);
        const datos = await resp.json();
        if (!resp.ok) {
            resultado.textContent = datos.error || 'Error al calcular la ruta';
            return;
        }
        resultado.textContent = `Distancia: ${datos.distanciaKm.toFixed(1)} km · Duración: ${Math.round(datos.duracionMin)} min`;
        if (linea) mapa.removeLayer(linea);
        linea = L.polyline(datos.puntos, {color: '#2563eb', weight: 5}).addTo(mapa);
        mapa.fitBounds(linea.getBounds());
    });
</script>
</body>
</html>
